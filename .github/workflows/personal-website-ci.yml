name: Personal Website CI

on:
  push:
    branches:
      - master
      - main
      - "codex/**"
    paths:
      - "personal-website/**"
      - ".github/workflows/personal-website-ci.yml"
  pull_request:
    paths:
      - "personal-website/**"
      - ".github/workflows/personal-website-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Database permissions and commerce regressions
        run: npm run test:database && npm run test:commerce

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Compiled authentication and order flow
        run: npm run test:http
