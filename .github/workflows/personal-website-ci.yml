name: Personal Website CI

on:
  push:
    branches:
      - master
      - main
      - "codex/**"
    paths:
      - "personal-website/**"
      - ".github/workflows/personal-website-ci.yml"
      - "netlify.toml"
  pull_request:
    paths:
      - "personal-website/**"
      - ".github/workflows/personal-website-ci.yml"
      - "netlify.toml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate content
        shell: pwsh
        run: ./scripts/content-check.ps1

      - name: Validate assets
        shell: pwsh
        run: ./scripts/validate-assets.ps1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
